<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ALink</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style></style>
</head>
<body style="background-color: #f4f7f6;">
    <header class="dashboard-header">
        <h2>ALink</h2>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="connections.html">Connections</a>
            <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
            <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="welcome-section">
            <h1>Welcome Back! <span id="role-badge" class="role-badge"></span></h1>
            <p id="user-email"></p>
        </div>

        <div class="dashboard-grid">
            <div class="dashboard-card">
                <h3>Recent Job Postings</h3>
                <div id="job-posts">
                    <p class="empty-state">Loading...</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>My Connections</h3>
                <div id="my-connections">
                    <p class="empty-state">Loading...</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>Upcoming Consultations</h3>
                <div id="my-bookings">
                    <p class="empty-state">Loading...</p>
                </div>
            </div>

            <div class="dashboard-card">
                <h3>Quick Actions</h3>
                <div class="quick-actions">
                    <a href="connections.html" class="quick-action-btn">Browse Alumni</a>
                    <a href="profile.html" class="quick-action-btn secondary">Edit Profile</a>
                </div>
                <div id="admin-actions" style="display: none; margin-top: 15px;">
                    <h4 style="margin: 15px 0 10px 0; color: var(--primary-navy);">Admin Actions</h4>
                    <a href="admin.html" class="quick-action-btn" style="background: var(--accent-gold); color: var(--primary-navy);">Admin Panel</a>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) return;

            const user = getCurrentUser();
            if (!user) {
                logout();
                return;
            }

            // Update UI with user info
            document.getElementById('user-email').textContent = user.email || '';
            const roleBadge = document.getElementById('role-badge');
            roleBadge.textContent = user.role.charAt(0).toUpperCase() + user.role.slice(1);
            roleBadge.className = 'role-badge role-' + user.role;

            // Show admin link and actions if admin
            if (user.role === 'admin') {
                document.getElementById('admin-link').style.display = 'inline';
                document.getElementById('admin-actions').style.display = 'block';
            }

            // Load dashboard data
            await loadJobPosts();
            await loadConnections();
            await loadBookings();
        });

        async function loadJobPosts() {
            try {
                const jobs = await api.request('/student/jobs', 'GET', null, true);
                const container = document.getElementById('job-posts');

                if (!jobs || jobs.length === 0) {
                    container.innerHTML = '<p class="empty-state">No job postings yet.</p>';
                    return;
                }

                container.innerHTML = jobs.slice(0, 3).map(job => `
                    <div class="job-item">
                        <h4>Job #${job.id}</h4>
                        <p>${job.content ? job.content.substring(0, 100) + '...' : 'No content'}</p>
                        ${job.link ? `<a href="${job.link}" target="_blank" style="color: var(--accent-teal);">View More</a>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('job-posts').innerHTML = '<p class="empty-state">Error loading jobs.</p>';
            }
        }

        async function loadConnections() {
            try {
                const user = getCurrentUser();
                const endpoint = user.role === 'alumni' ? '/alumni/connections' : '/student/connections';
                const connections = await api.request(endpoint, 'GET', null, true);
                const container = document.getElementById('my-connections');

                if (!connections || connections.length === 0) {
                    container.innerHTML = '<p class="empty-state">No connections yet. <a href="connections.html" style="color: var(--accent-teal);">Browse Alumni</a></p>';
                    return;
                }

                container.innerHTML = connections.slice(0, 3).map(c => `
                    <div class="connection-item">
                        <h4>Connection #${c.id}</h4>
                        <p>Status: ${c.status}</p>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('my-connections').innerHTML = '<p class="empty-state">Error loading connections.</p>';
            }
        }

        async function loadBookings() {
            try {
                const user = getCurrentUser();
                const endpoint = user.role === 'alumni' ? '/alumni/bookings' : '/student/bookings';
                const bookings = await api.request(endpoint, 'GET', null, true);
                const container = document.getElementById('my-bookings');

                if (!bookings || bookings.length === 0) {
                    container.innerHTML = '<p class="empty-state">No upcoming consultations.</p>';
                    return;
                }

                container.innerHTML = bookings.slice(0, 3).map(b => `
                    <div class="booking-item">
                        <h4>Consultation #${b.id}</h4>
                        <p>Status: ${b.status}</p>
                        <p>Time: ${b.scheduled_time}</p>
                        ${b.meeting_link ? `<a href="${b.meeting_link}" target="_blank" style="color: var(--accent-teal);">Join Meeting</a>` : ''}
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('my-bookings').innerHTML = '<p class="empty-state">Error loading bookings.</p>';
            }
        }
    </script>
</body>
</html>
